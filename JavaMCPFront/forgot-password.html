<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - MCP App</title>
    <link rel="stylesheet" href="css/verify-email.css">
</head>
<body>
    <div class="verify-container">
        <div class="logo">
            <div class="logo-icon">🔑</div>
            <h1>Recuperar Contraseña</h1>
            <p class="subtitle">Ingresa tu email para recibir un código</p>
        </div>

        <form id="forgot-form">
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="email" style="display: block; color: #cbd5e1; font-size: 14px; margin-bottom: 8px;">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="tu-email@ejemplo.com"
                    required
                    autofocus
                    style="width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #fff; font-size: 15px; outline: none;"
                >
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span id="btn-text">Enviar Código</span>
                <div class="loading-spinner" id="loading-spinner"></div>
            </button>

            <div id="message"></div>
        </form>

        <div class="footer-link">
            <a href="login.html">← Volver al login</a>
        </div>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
