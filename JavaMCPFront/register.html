<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MCP App</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <div class="logo-icon">📝</div>
            <h1>Crear Cuenta</h1>
            <p class="subtitle">Únete a MCP App</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Elige un nombre de usuario"
                        required 
                        autofocus
                        minlength="3"
                    >
                    <span class="input-hint">Mínimo 3 caracteres</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="tu-email@ejemplo.com"
                        required
                    >
                    <span class="input-hint">Recibirás un código de verificación</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Crea una contraseña segura"
                        required
                        minlength="3"
                    >
                    <span class="input-hint">Mínimo 3 caracteres</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        placeholder="Repite tu contraseña"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span id="btn-text">Crear Cuenta</span>
                <div class="loading-spinner" id="loading-spinner"></div>
            </button>

            <div id="message"></div>
        </form>

        <div class="divider">
            <span>O regístrate con</span>
        </div>

        <div class="social-buttons">
            <a href="http://localhost:8080/oauth2/authorization/google" class="social-btn google">
                <span class="social-icon">🔵</span>
                <span>Google</span>
            </a>
            
            <a href="http://localhost:8080/oauth2/authorization/github" class="social-btn github">
                <span class="social-icon">⚫</span>
                <span>GitHub</span>
            </a>
        </div>

        <div class="footer-link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
