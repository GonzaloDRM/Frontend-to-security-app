<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - MCP App</title>
    <link rel="stylesheet" href="css/verify-email.css">
</head>
<body>
    <div class="verify-container">
        <div class="logo">
            <div class="logo-icon">🔒</div>
            <h1>Nueva Contraseña</h1>
            <p class="subtitle" id="subtitle">Ingresa el código y tu nueva contraseña</p>
        </div>

        <div class="email-info" id="email-info"></div>

        <form id="reset-form">
            <div class="code-input-group">
                <input type="text" maxlength="1" class="code-input" id="digit-1" autofocus>
                <input type="text" maxlength="1" class="code-input" id="digit-2">
                <input type="text" maxlength="1" class="code-input" id="digit-3">
                <input type="text" maxlength="1" class="code-input" id="digit-4">
                <input type="text" maxlength="1" class="code-input" id="digit-5">
                <input type="text" maxlength="1" class="code-input" id="digit-6">
            </div>

            <div class="form-group" style="margin: 24px 0;">
                <label for="new-password" style="display: block; color: #cbd5e1; font-size: 14px; margin-bottom: 8px;">Nueva Contraseña</label>
                <input 
                    type="password" 
                    id="new-password" 
                    name="new-password" 
                    placeholder="Ingresa tu nueva contraseña"
                    required
                    minlength="3"
                    style="width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #fff; font-size: 15px; outline: none;"
                >
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="confirm-password" style="display: block; color: #cbd5e1; font-size: 14px; margin-bottom: 8px;">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    name="confirm-password" 
                    placeholder="Repite tu nueva contraseña"
                    required
                    style="width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #fff; font-size: 15px; outline: none;"
                >
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span id="btn-text">Restablecer Contraseña</span>
                <div class="loading-spinner" id="loading-spinner"></div>
            </button>

            <div id="message"></div>
        </form>

        <div class="footer-link">
            <a href="login.html">← Volver al login</a>
        </div>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>
